[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service"
version = "0.1.0"
description = "Identity service: accounts, credentials and token issuance"
requires-python = ">=3.12"
dependencies = [
    "app-common>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "redis>=5.0",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "application*", "domain*", "infrastructure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["api", "application", "domain", "infrastructure"]
