[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
description = "AI agent service: RAG over system documentation with OpenAI and Qdrant"
requires-python = ">=3.12"
dependencies = [
    "app-common>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.40",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "application*", "domain*", "infrastructure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["api", "application", "domain", "infrastructure"]
