name: user-management

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  fastembed_cache:
  bootstrap_state:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      USERS_DB_NAME: ${USERS_DB_NAME}
      ROLES_DB_NAME: ${ROLES_DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - backend-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    entrypoint: ["/bin/sh", "/etc/rabbitmq/render-definitions.sh"]
    command: ["rabbitmq-server"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.template.json:ro
      - ./infra/rabbitmq/render-definitions.sh:/etc/rabbitmq/render-definitions.sh:ro
      - ./infra/rabbitmq/load-definitions.conf:/etc/rabbitmq/conf.d/20-load-definitions.conf:ro
    ports:
      - "15672:15672"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ROLE_SERVICE_URL: ${ROLE_SERVICE_URL:-http://role-service:8000}
      ROLE_SERVICE_TIMEOUT_SECONDS: ${ROLE_SERVICE_TIMEOUT_SECONDS:-2}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Read by uvicorn: trust X-Forwarded-For (set by the frontend Nginx). APIs are
      # not published to the host, so only containers on the Docker networks reach them.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - ./infra/keys:/run/secrets:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${USERS_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  role-service:
    build:
      context: ./services
      dockerfile: role-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: role-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ROLES_DB_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - frontend-net
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      role-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  audit-service:
    build:
      context: ./services
      dockerfile: audit-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: audit-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    build:
      context: ./services
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: ai-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      FASTEMBED_CACHE_DIR: ${FASTEMBED_CACHE_DIR:-/models}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
      AI_RETRY_BACKOFF_SECONDS: ${AI_RETRY_BACKOFF_SECONDS:-0.5}
      CHAT_INPUT_PRICE_PER_MILLION: ${CHAT_INPUT_PRICE_PER_MILLION:-0.15}
      CHAT_OUTPUT_PRICE_PER_MILLION: ${CHAT_OUTPUT_PRICE_PER_MILLION:-0.50}
      EMBEDDING_INPUT_PRICE_PER_MILLION: ${EMBEDDING_INPUT_PRICE_PER_MILLION:-0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-system_docs_fastembed_v1}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.2}
      DOCS_PATH: /app/docs
      PROMPT_DIR: /app/prompts
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      TOP_K: ${TOP_K:-4}
      MAX_ANSWER_TOKENS: ${MAX_ANSWER_TOKENS:-1200}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      METRICS_WINDOW_SIZE: ${METRICS_WINDOW_SIZE:-200}
      JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8000}
      ROLE_SERVICE_URL: ${ROLE_SERVICE_URL:-http://role-service:8000}
      REDIS_URL: ${REDIS_URL}
      AI_RATE_LIMIT_REQUESTS: ${AI_RATE_LIMIT_REQUESTS:-20}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./docs:/app/docs:ro
      - fastembed_cache:/models
    networks:
      - frontend-net
      - backend-net
    depends_on:
      qdrant:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      role-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot admin bootstrap (profile `local`, enabled with COMPOSE_PROFILES=local).
  # The password only travels through stdin of the container process, never as an
  # argument. Both containers run as root to write the shared volume owned by Docker;
  # they are ephemeral and local-only.
  bootstrap-account:
    profiles: ["local"]
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        out=$$(printf "%s\n" "$$BOOTSTRAP_ADMIN_PASSWORD"
        | python bootstrap_account.py --email "$$BOOTSTRAP_ADMIN_EMAIL" --password-stdin)
        && printf "%s" "$$out" > /bootstrap/account_id
        && echo "account: $$out"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - bootstrap_state:/bootstrap
    networks:
      - backend-net
    depends_on:
      auth-service:
        condition: service_healthy

  bootstrap-admin:
    profiles: ["local"]
    build:
      context: ./services
      dockerfile: role-service/Dockerfile
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python bootstrap_admin.py --account-id "$$(cat /bootstrap/account_id)"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ROLES_DB_NAME}
    volumes:
      - bootstrap_state:/bootstrap
    networks:
      - backend-net
    depends_on:
      role-service:
        condition: service_healthy
      bootstrap-account:
        condition: service_completed_successfully

