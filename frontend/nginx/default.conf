server_tokens off;

# Docker DNS: upstreams are resolved per request so restarted services get their new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # X-Forwarded-For is overwritten (not appended) so clients cannot spoof the IP
    # used by the auth-service rate limit.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location ^~ /api/ai/ {
        set $upstream http://ai-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        # The first reindex downloads the local embedding model.
        proxy_read_timeout 600s;
    }

    location ^~ /api/auth/ {
        set $upstream http://auth-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # Role assignments live in role-service even though they hang from /users.
    location ~ ^/api/users/[^/]+/(roles|permissions)(/[^/]+)?$ {
        set $upstream http://role-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/users(/.*)?$ {
        set $upstream http://user-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/roles(/.*)?$ {
        set $upstream http://role-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location = /api/audit {
        set $upstream http://audit-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"code":"not_found","message":"Unknown API route","details":null}';
    }

    # No add_header inside locations: it would drop the security headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Self-hosted fonts and brand assets (kept local so the CSP stays default-src 'self').
    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
